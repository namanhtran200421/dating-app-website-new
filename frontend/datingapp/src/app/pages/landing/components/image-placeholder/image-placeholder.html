<div
  class="relative flex w-full items-center justify-center bg-blossom/40 px-4 text-center font-body text-xs text-ink/50"
  [style.aspect-ratio]="ratio()"
>
  <svg
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 h-full w-full"
    preserveAspectRatio="none"
  >
    <rect
      x="1"
      y="1"
      width="calc(100% - 2px)"
      height="calc(100% - 2px)"
      rx="20"
      fill="none"
      stroke="rgba(28, 20, 24, 0.3)"
      stroke-width="1.5"
      stroke-dasharray="5 5"
      stroke-linecap="round"
      vector-effect="non-scaling-stroke"
    />
  </svg>

  <span class="relative">{{ label() }}</span>
</div>
