<div id="top" class="contact-page">
  <main class="contact-shell" aria-labelledby="contact-title">
    <header data-motion-reveal="fade" class="contact-header">
      <h1 id="contact-title">Message us.</h1>
    </header>

    <section data-motion-reveal class="contact-letter" aria-label="Send Rosemarry a message">
      <form [formGroup]="contactForm" (ngSubmit)="addContact()" novalidate class="contact-form">
        <div class="contact-form__names">
          <label class="contact-field">
            <span>First name</span>
            <input
              type="text"
              formControlName="firstName"
              autocomplete="given-name"
              [class.contact-control--error]="
                contactForm.controls.firstName.touched && contactForm.controls.firstName.invalid
              "
            />
            @if (
              contactForm.controls.firstName.touched &&
              (contactForm.controls.firstName.hasError('required') ||
                contactForm.controls.firstName.hasError('blank'))
            ) {
              <small>Enter your first name.</small>
            } @else if (
              contactForm.controls.firstName.touched &&
              contactForm.controls.firstName.hasError('maxlength')
            ) {
              <small>Keep your first name under 100 characters.</small>
            }
          </label>

          <label class="contact-field">
            <span>Last name</span>
            <input
              type="text"
              formControlName="lastName"
              autocomplete="family-name"
              [class.contact-control--error]="
                contactForm.controls.lastName.touched && contactForm.controls.lastName.invalid
              "
            />
            @if (
              contactForm.controls.lastName.touched &&
              (contactForm.controls.lastName.hasError('required') ||
                contactForm.controls.lastName.hasError('blank'))
            ) {
              <small>Enter your last name.</small>
            } @else if (
              contactForm.controls.lastName.touched &&
              contactForm.controls.lastName.hasError('maxlength')
            ) {
              <small>Keep your last name under 100 characters.</small>
            }
          </label>
        </div>

        <label class="contact-field">
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            [class.contact-control--error]="
              contactForm.controls.email.touched && contactForm.controls.email.invalid
            "
          />
          @if (
            contactForm.controls.email.touched && contactForm.controls.email.hasError('required')
          ) {
            <small>Enter your email.</small>
          } @else if (
            contactForm.controls.email.touched && contactForm.controls.email.hasError('pattern')
          ) {
            <small>Enter a valid email.</small>
          } @else if (
            contactForm.controls.email.touched && contactForm.controls.email.hasError('maxlength')
          ) {
            <small>Keep your email under 254 characters.</small>
          }
        </label>

        <label class="contact-field">
          <span>Subject</span>
          <span class="contact-select">
            <select
              formControlName="subject"
              [class.contact-control--error]="
                contactForm.controls.subject.touched && contactForm.controls.subject.invalid
              "
            >
              <option value="" disabled>Select a subject</option>
              <option value="General question">General question</option>
              <option value="Feedback">Feedback</option>
              <option value="Partnerships">Partnership</option>
              <option value="Press">Press or media</option>
            </select>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m7 9.5 5 5 5-5"></path>
            </svg>
          </span>
          @if (
            contactForm.controls.subject.touched &&
            contactForm.controls.subject.hasError('required')
          ) {
            <small>Select a subject.</small>
          }
        </label>

        <label class="contact-field">
          <span>Message</span>
          <textarea
            class="resize-none"
            formControlName="message"
            rows="5"
            [class.contact-control--error]="
              contactForm.controls.message.touched && contactForm.controls.message.invalid
            "
          ></textarea>
          @if (
            contactForm.controls.message.touched &&
            (contactForm.controls.message.hasError('required') ||
              contactForm.controls.message.hasError('blank'))
          ) {
            <small>Enter a message.</small>
          } @else if (
            contactForm.controls.message.touched &&
            contactForm.controls.message.hasError('maxlength')
          ) {
            <small>Keep your message under 5,000 characters.</small>
          }
        </label>

        <app-turnstile-widget
          class="contact-form__turnstile"
          action="contact"
          [resetVersion]="turnstileResetVersion()"
          (tokenChange)="setTurnstileToken($event)"
          (verificationError)="markTurnstileError()"
        />

        @if (securityError()) {
          <small class="contact-form__security-error" role="alert">
            Complete the security check and try again.
          </small>
        }

        @if (submissionError()) {
          <div class="contact-form__submission-error" role="alert">
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            <p>{{ submissionError() }}</p>
          </div>
        }

        <div class="contact-form__footer">
          <button type="submit" class="rm-pop" [disabled]="isSubmitting() || !turnstileToken()">
            {{ isSubmitting() ? 'Sending…' : 'Send message' }}
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
