<dialog
  class="early-stage-dialog"
  aria-labelledby="early-stage-title"
  aria-describedby="early-stage-description"
  (cancel)="handleCancel($event)"
  (click)="handleBackdropClick($event)"
  (close)="handleClose()"
  (keydown)="handleKeydown($event)"
>
  <section class="early-stage-card">
    <header class="early-stage-card__header">
      <div class="early-stage-card__brand" aria-label="Rosemarry">
        <img src="/images/rosemarry/rose-hand-logo.png" alt="" width="132" height="104" />
        <span>Rosemarry</span>
      </div>
      <button
        class="early-stage-card__close"
        type="button"
        aria-label="Close development notice"
        (click)="dismiss()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <div class="early-stage-card__body">
      <p class="early-stage-card__eyebrow">A quick heads-up</p>
      <h2 id="early-stage-title" tabindex="-1">We&rsquo;re still<br />in development.</h2>
      <p id="early-stage-description" class="early-stage-card__description">
        Launch timing and locations have not been announced.
      </p>
      <button class="early-stage-card__action" type="button" (click)="dismiss()">
        Keep exploring
      </button>
    </div>
  </section>
</dialog>
