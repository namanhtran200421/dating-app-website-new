@if (visible()) {
  <aside
    class="early-stage-banner"
    role="status"
    aria-labelledby="early-stage-title"
    aria-describedby="early-stage-description"
  >
    <div class="early-stage-banner__glow" aria-hidden="true"></div>

    <div class="early-stage-banner__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3Z"></path>
        <path d="m18.5 14 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"></path>
      </svg>
    </div>

    <div class="early-stage-banner__copy">
      <span class="early-stage-banner__label">Early-stage</span>
      <h2 id="early-stage-title">You&rsquo;re seeing the preview.</h2>
      <p id="early-stage-description">
        Rosemarry is still taking shape. Features, wording, and policies may evolve as we learn,
        build, and get ready for launch.
      </p>
    </div>

    <button
      type="button"
      class="early-stage-banner__close"
      aria-label="Dismiss early-stage notice"
      (click)="dismiss()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18"></path>
      </svg>
    </button>
  </aside>
}
