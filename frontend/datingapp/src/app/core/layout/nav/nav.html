<nav
  class="site-nav"
  [class.site-nav--scrolled]="scrolled() || menuOpen()"
  [class.site-nav--dark]="darkBackground() && !scrolled() && !menuOpen()"
>
  <a routerLink="/" fragment="top" (click)="closeMenu()" class="site-nav__brand">
    <img src="/images/rosemarry/rose-hand-logo.png" alt="" width="48" height="37" />
    <span>Rosemarry</span>
  </a>

  <div class="site-nav__links">
    <a routerLink="/" fragment="problem">Why Rosemarry</a>
    <a routerLink="/" fragment="how-it-works">How it works</a>
    <a routerLink="/" fragment="inside-circle">Inside a Circle</a>
    <a routerLink="/about-us" routerLinkActive="is-active">Our story</a>
    <button type="button" (click)="signup.goToSignup()">
      Join early <span aria-hidden="true">→</span>
    </button>
  </div>

  <button
    type="button"
    class="site-nav__menu"
    aria-label="Toggle navigation menu"
    aria-controls="mobile-navigation"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <span aria-hidden="true">×</span>
    } @else {
      <span aria-hidden="true">☰</span>
    }
  </button>

  <div
    id="mobile-navigation"
    class="site-nav__mobile"
    [class.site-nav__mobile--open]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <a routerLink="/" fragment="problem" (click)="closeMenu()">Why Rosemarry <span>→</span></a>
    <a routerLink="/" fragment="how-it-works" (click)="closeMenu()">How it works <span>→</span></a>
    <a routerLink="/" fragment="inside-circle" (click)="closeMenu()"
      >Inside a Circle <span>→</span></a
    >
    <a routerLink="/about-us" (click)="closeMenu()">Our story <span>→</span></a>
    <button type="button" (click)="closeMenu(); signup.goToSignup()">
      Join early access <span>→</span>
    </button>
  </div>
</nav>
