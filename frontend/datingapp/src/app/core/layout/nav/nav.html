<nav
  aria-label="Main navigation"
  class="site-nav fixed inset-x-0 top-0 z-50 flex items-center justify-between gap-3 border-b px-[clamp(14px,4vw,44px)] py-3 font-body transition-colors duration-300"
  [class.bg-cream/90]="scrolled() || menuOpen()"
  [class.backdrop-blur-md]="scrolled() || menuOpen()"
  [class.border-ink/10]="scrolled() || menuOpen()"
  [class.border-transparent]="!scrolled() && !menuOpen()"
  [class.nav--over-dark]="darkBackground() && !scrolled() && !menuOpen()"
  [class.site-nav--hidden]="navHidden()"
>
  <a routerLink="/" fragment="top" (click)="closeMenu()" class="site-nav__brand">
    <img src="/images/rosemarry/rose-hand-logo.png" alt="" width="48" height="37" />
    <span>Rosemarry</span>
  </a>

  <div class="nav-desktop hidden items-center xl:flex">
    <div class="nav-desktop__primary">
      <a routerLink="/" fragment="how-it-works" class="nav-desktop-link" (click)="closeMenu()">
        <span>How it works</span>
      </a>
      <a
        routerLink="/blog"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-desktop-link"
        (click)="closeMenu()"
      >
        <span>Journal</span>
      </a>

      <div
        class="nav-company"
        routerLinkActive="nav-company--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <button
          #companyMenuTrigger
          type="button"
          class="nav-desktop-link nav-company__trigger"
          aria-controls="desktop-company-navigation"
          aria-haspopup="true"
          [attr.aria-expanded]="desktopMenuOpen()"
          (click)="toggleDesktopMenu()"
        >
          <span>Company</span>
          <svg
            class="nav-company__chevron"
            viewBox="0 0 16 16"
            width="16"
            height="16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m4 6 4 4 4-4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div
          id="desktop-company-navigation"
          class="nav-company__panel"
          [class.nav-company__panel--open]="desktopMenuOpen()"
          [attr.aria-hidden]="!desktopMenuOpen()"
          [attr.inert]="desktopMenuOpen() ? null : ''"
        >
          <div class="nav-company__heading" aria-hidden="true">
            <span>Behind Rosemarry</span>
            <span>✦</span>
          </div>
          <a
            routerLink="/about-us"
            routerLinkActive="nav-company__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-company__link"
            (click)="closeMenu()"
          >
            <span class="nav-company__icon" aria-hidden="true"
              ><i class="fa-regular fa-heart"></i
            ></span>
            <span><strong>Our story</strong><small>Meet the people building it</small></span>
            <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
          </a>
          <a
            routerLink="/press"
            routerLinkActive="nav-company__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-company__link"
            (click)="closeMenu()"
          >
            <span class="nav-company__icon" aria-hidden="true"
              ><i class="fa-regular fa-newspaper"></i
            ></span>
            <span><strong>Press kit</strong><small>Facts, founders and brand assets</small></span>
            <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
          </a>
          <a
            routerLink="/contact-us"
            routerLinkActive="nav-company__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-company__link"
            (click)="closeMenu()"
          >
            <span class="nav-company__icon" aria-hidden="true"
              ><i class="fa-regular fa-paper-plane"></i
            ></span>
            <span><strong>Message us</strong><small>Support, feedback or partnerships</small></span>
            <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>

    <span class="nav-desktop__divider" aria-hidden="true"></span>

    <div class="nav-desktop__actions">
      <a
        class="nav-instagram"
        href="https://www.instagram.com/rosemarry_app/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Rosemarry on Instagram (opens in a new tab)"
        title="Rosemarry on Instagram"
      >
        <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      </a>
      <button type="button" class="nav-join" (click)="closeMenu(); signup.goToSignup()">
        <span>Join early access</span>
        <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <button
    type="button"
    class="site-nav__menu"
    aria-label="Toggle navigation menu"
    aria-controls="mobile-navigation"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <span aria-hidden="true">×</span>
    } @else {
      <span aria-hidden="true">☰</span>
    }
  </button>

  <div
    id="mobile-navigation"
    class="site-nav__mobile"
    [class.site-nav__mobile--open]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <a
      routerLink="/"
      fragment="how-it-works"
      (click)="closeMenu()"
      class="rm-row flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline"
    >
      <span class="nav-mobile-link__label">How it works</span>
      <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/blog"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="rm-row flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline"
    >
      <span class="nav-mobile-link__label">Blog</span>
      <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/about-us"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="rm-row flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline"
    >
      <span class="nav-mobile-link__label">Our story</span>
      <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/contact-us"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="rm-row flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline"
    >
      <span class="nav-mobile-link__label">Message us</span>
      <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/press"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="rm-row flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline"
    >
      <span class="nav-mobile-link__label">Press kit</span>
      <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
    </a>
    <button
      type="button"
      (click)="closeMenu(); signup.goToSignup()"
      class="rm-pop flex items-center justify-between rounded-2xl bg-ink px-4 py-3.5 text-sm font-semibold text-white no-underline"
    >
      Join early access
      <i class="fa-solid fa-arrow-right rm-arrow" aria-hidden="true"></i>
    </button>
    <a
      href="https://www.instagram.com/rosemarry_app/"
      target="_blank"
      rel="noopener"
      (click)="closeMenu()"
      class="rm-row flex items-center justify-between rounded-2xl bg-birdpink px-4 py-3.5 text-sm font-semibold text-ink no-underline"
    >
      Catch us on Insta
      <i class="fa-brands fa-instagram" aria-hidden="true"></i>
    </a>
  </div>
</nav>
