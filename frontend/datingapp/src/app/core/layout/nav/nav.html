<nav
  aria-label="Main navigation"
  class="site-nav fixed inset-x-0 top-0 z-50 flex items-center justify-between gap-3 border-b px-[clamp(14px,4vw,44px)] py-3 font-body transition-colors duration-300"
  [class.bg-cream/90]="scrolled() || menuOpen()"
  [class.backdrop-blur-md]="scrolled() || menuOpen()"
  [class.border-ink/10]="scrolled() || menuOpen()"
  [class.border-transparent]="!scrolled() && !menuOpen()"
  [class.nav--over-dark]="darkBackground() && !scrolled() && !menuOpen()"
  [class.site-nav--hidden]="navHidden()"
>
  <a
    routerLink="/"
    fragment="top"
    (click)="closeMenu()"
    class="flex min-w-0 items-center gap-2 no-underline"
  >
    <img
      src="images/rosemarry/logo-160.png"
      width="160"
      height="120"
      loading="eager"
      fetchpriority="high"
      decoding="async"
      alt="Rosemarry logo"
      class="h-9 w-auto block"
    />
    <span
      class="nav-brand__name font-display text-[clamp(18px,5.6vw,23px)] font-semibold tracking-tight text-ink"
      >Rosemarry</span
    >
  </a>

  <div class="nav-desktop hidden items-center xl:flex">
    <div class="nav-desktop__primary">
      <a
        routerLink="/circle"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-desktop-link"
        (click)="closeMenu()"
      >
        <span>How it works</span>
      </a>
      <a
        routerLink="/blog"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-desktop-link"
        (click)="closeMenu()"
      >
        <span>Journal</span>
      </a>

      <div
        class="nav-company"
        routerLinkActive="nav-company--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <button
          #companyMenuTrigger
          type="button"
          class="nav-desktop-link nav-company__trigger"
          aria-controls="desktop-company-navigation"
          aria-haspopup="true"
          [attr.aria-expanded]="desktopMenuOpen()"
          (click)="toggleDesktopMenu()"
        >
          <span>Company</span>
          <svg
            class="nav-company__chevron"
            viewBox="0 0 16 16"
            width="16"
            height="16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m4 6 4 4 4-4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div
          id="desktop-company-navigation"
          class="nav-company__panel"
          [class.nav-company__panel--open]="desktopMenuOpen()"
          [attr.aria-hidden]="!desktopMenuOpen()"
          [attr.inert]="desktopMenuOpen() ? null : ''"
        >
          <div class="nav-company__heading" aria-hidden="true">
            <span>Behind Rosemarry</span>
            <span>✦</span>
          </div>
          <a
            routerLink="/about-us"
            routerLinkActive="nav-company__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-company__link"
            (click)="closeMenu()"
          >
            <span class="nav-company__icon" aria-hidden="true"
              ><i class="fa-regular fa-heart"></i
            ></span>
            <span><strong>Our story</strong><small>Meet the people building it</small></span>
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
          <a
            routerLink="/press"
            routerLinkActive="nav-company__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-company__link"
            (click)="closeMenu()"
          >
            <span class="nav-company__icon" aria-hidden="true"
              ><i class="fa-regular fa-newspaper"></i
            ></span>
            <span><strong>Press kit</strong><small>Facts, founders and brand assets</small></span>
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
          <a
            routerLink="/contact-us"
            routerLinkActive="nav-company__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-company__link"
            (click)="closeMenu()"
          >
            <span class="nav-company__icon" aria-hidden="true"
              ><i class="fa-regular fa-paper-plane"></i
            ></span>
            <span><strong>Message us</strong><small>Support, feedback or partnerships</small></span>
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>

    <span class="nav-desktop__divider" aria-hidden="true"></span>

    <div class="nav-desktop__actions">
      <a
        class="nav-instagram"
        href="https://www.instagram.com/rosemarry_app/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Rosemarry on Instagram (opens in a new tab)"
        title="Rosemarry on Instagram"
      >
        <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      </a>
      <a
        class="nav-join"
        href="#join"
        (click)="$event.preventDefault(); closeMenu(); signup.goToSignup()"
      >
        <span>Join early access</span>
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>
    </div>
  </div>

  <button
    type="button"
    class="nav-menu-button pricing-card-hover inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-transparent text-white shadow-[0_10px_24px_-14px_rgba(28,20,24,0.85)] transition-[background-color,transform] duration-200 hover:-translate-y-0.5 xl:hidden"
    [class.bg-ink]="!menuOpen()"
    [class.bg-birdpink]="menuOpen()"
    aria-label="Toggle navigation menu"
    aria-controls="mobile-navigation"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M6 6l12 12M18 6 6 18"></path>
      </svg>
    } @else {
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </svg>
    }
  </button>

  <div
    id="mobile-navigation"
    class="absolute inset-x-3 top-full mt-2 flex origin-top flex-col gap-2 rounded-[28px] border border-rose/15 bg-blossom p-3 shadow-[0_24px_50px_-24px_rgba(28,20,24,0.45)] transition-[opacity,transform] duration-200 ease-out xl:hidden"
    [class.pointer-events-none]="!menuOpen()"
    [class.-translate-y-1]="!menuOpen()"
    [class.scale-[0.985]]="!menuOpen()"
    [class.opacity-0]="!menuOpen()"
    [class.translate-y-0]="menuOpen()"
    [class.scale-100]="menuOpen()"
    [class.opacity-100]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <a
      routerLink="/circle"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline transition-colors hover:bg-white"
    >
      <span class="nav-mobile-link__label">Circle </span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/blog"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline transition-colors hover:bg-white"
    >
      <span class="nav-mobile-link__label">Blog</span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/about-us"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline transition-colors hover:bg-white"
    >
      <span class="nav-mobile-link__label">Our story</span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/contact-us"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline transition-colors hover:bg-white"
    >
      <span class="nav-mobile-link__label">Message us</span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/press"
      routerLinkActive="nav-mobile-link--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-white/60 px-4 py-3.5 text-sm font-semibold text-ink no-underline transition-colors hover:bg-white"
    >
      <span class="nav-mobile-link__label">Press kit</span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a
      href="#join"
      (click)="$event.preventDefault(); closeMenu(); signup.goToSignup()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-ink px-4 py-3.5 text-sm font-semibold text-white no-underline transition-colors hover:bg-rose"
    >
      Get in early
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a
      href="https://www.instagram.com/rosemarry_app/"
      target="_blank"
      rel="noopener"
      (click)="closeMenu()"
      class="pricing-card-hover flex items-center justify-between rounded-2xl bg-birdpink px-4 py-3.5 text-sm font-semibold text-ink no-underline transition-[filter] hover:brightness-105"
    >
      Catch us on Insta
      <i class="fa-brands fa-instagram" aria-hidden="true"></i>
    </a>
  </div>
</nav>
